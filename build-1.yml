name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Loyiha fayllarini yaratish
        run: |
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'uz.vpn.ssh'
              compileSdk 34

              defaultConfig {
                  applicationId 'uz.vpn.ssh'
                  minSdk 26
                  targetSdk 33
                  versionCode 1
                  versionName '1.0'
                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }
              }

              externalNativeBuild {
                  ndkBuild {
                      path 'src/main/jni/Android.mk'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'com.github.mwiede:jsch:0.2.18'
          }

          EOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="Otabek VPN"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".TunnelService"
                      android:exported="false"
                      android:permission="android.permission.BIND_VPN_SERVICE">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>

          EOF
          mkdir -p "$(dirname 'app/src/main/java/hev/htproxy/TProxyService.java')"
          cat > 'app/src/main/java/hev/htproxy/TProxyService.java' <<'EOF'
          package hev.htproxy;

          public class TProxyService {
              static {
                  System.loadLibrary("hev-socks5-tunnel");
              }

              public static native void TProxyStartService(String configPath, int fd);

              public static native void TProxyStopService();

              public static native long[] TProxyGetStats();
          }

          EOF
          mkdir -p "$(dirname 'app/src/main/java/uz/vpn/ssh/MainActivity.java')"
          cat > 'app/src/main/java/uz/vpn/ssh/MainActivity.java' <<'EOF'
          package uz.vpn.ssh;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.InputType;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private EditText ip, port, user, pass;
              private TextView info;
              private Button pauseBtn;
              private final Handler h = new Handler(Looper.getMainLooper());
              private final Runnable tick = new Runnable() {
                  @Override
                  public void run() {
                      refresh();
                      h.postDelayed(this, 500);
                  }
              };

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              private EditText field(LinearLayout parent, String hint, String val, int type) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setText(val);
                  e.setInputType(type);
                  e.setSingleLine(true);
                  parent.addView(e);
                  return e;
              }

              private Button button(LinearLayout parent, String text, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setOnClickListener(l);
                  parent.addView(b);
                  return b;
              }

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  SharedPreferences p = getSharedPreferences("cfg", 0);

                  ScrollView sv = new ScrollView(this);
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setPadding(dp(16), dp(48), dp(16), dp(24));
                  sv.addView(l);

                  TextView title = new TextView(this);
                  title.setText("Otabek VPN");
                  title.setTextSize(26);
                  l.addView(title);

                  ip = field(l, "Server IP", p.getString("ip", ""), InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_URI);
                  port = field(l, "SSH port", p.getString("port", "22"), InputType.TYPE_CLASS_NUMBER);
                  user = field(l, "Login", p.getString("user", "root"), InputType.TYPE_CLASS_TEXT);
                  pass = field(l, "Parol", p.getString("pass", ""), InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);

                  button(l, "Ulash", v -> onConnect());
                  pauseBtn = button(l, "Pauza", v -> send(State.paused ? TunnelService.A_RESUME : TunnelService.A_PAUSE));
                  button(l, "Qayta ulash", v -> send(TunnelService.A_RECONNECT));
                  button(l, "To'xtatish", v -> send(TunnelService.A_STOP));
                  button(l, "Server ma'lumotini o'chirish", v -> {
                      send(TunnelService.A_STOP);
                      getSharedPreferences("cfg", 0).edit().clear().apply();
                      ip.setText("");
                      port.setText("22");
                      user.setText("root");
                      pass.setText("");
                      Toast.makeText(this, "O'chirildi", Toast.LENGTH_SHORT).show();
                  });

                  info = new TextView(this);
                  info.setTextSize(18);
                  info.setPadding(0, dp(24), 0, 0);
                  l.addView(info);

                  setContentView(sv);

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 2);
                  }
              }

              private void onConnect() {
                  String a = ip.getText().toString().trim();
                  String pw = pass.getText().toString();
                  if (a.isEmpty() || pw.isEmpty()) {
                      Toast.makeText(this, "IP va parolni kiriting", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  String pt = port.getText().toString().trim();
                  if (pt.isEmpty()) pt = "22";
                  String us = user.getText().toString().trim();
                  if (us.isEmpty()) us = "root";
                  getSharedPreferences("cfg", 0).edit()
                          .putString("ip", a).putString("port", pt)
                          .putString("user", us).putString("pass", pw).apply();

                  Intent i = VpnService.prepare(this);
                  if (i != null) {
                      startActivityForResult(i, 1);
                  } else {
                      send(TunnelService.A_START);
                  }
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == 1 && res == RESULT_OK) send(TunnelService.A_START);
              }

              private void send(String action) {
                  if (!State.active && !TunnelService.A_START.equals(action)) return;
                  Intent i = new Intent(this, TunnelService.class).setAction(action);
                  startForegroundService(i);
              }

              private void refresh() {
                  String t = "Holat: " + State.status;
                  if (!State.error.isEmpty()) t += "\n" + State.error;
                  t += "\n\n↑ Yuborish: " + State.fmtSpeed(State.upSpeed)
                          + "\n↓ Qabul: " + State.fmtSpeed(State.downSpeed)
                          + "\n\nJami yuborilgan: " + State.fmtSize(State.upTotal)
                          + "\nJami qabul qilingan: " + State.fmtSize(State.downTotal);
                  info.setText(t);
                  pauseBtn.setText(State.paused ? "Davom ettirish" : "Pauza");
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  h.post(tick);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  h.removeCallbacks(tick);
              }
          }

          EOF
          mkdir -p "$(dirname 'app/src/main/java/uz/vpn/ssh/SshSocks.java')"
          cat > 'app/src/main/java/uz/vpn/ssh/SshSocks.java' <<'EOF'
          package uz.vpn.ssh;

          import com.jcraft.jsch.Channel;
          import com.jcraft.jsch.JSch;
          import com.jcraft.jsch.JSchException;
          import com.jcraft.jsch.Session;

          import java.io.DataInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.DatagramPacket;
          import java.net.DatagramSocket;
          import java.net.InetAddress;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.util.Arrays;
          import java.util.Set;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.ScheduledExecutorService;
          import java.util.concurrent.ScheduledFuture;
          import java.util.concurrent.TimeUnit;

          /** Lokal SOCKS5 server (127.0.0.1:1080). Trafikni SSH orqali serverga uzatadi. */
          public class SshSocks {
              public static final int PORT = 1080;

              private final String host, user, pass;
              private final int port;
              private Session ssh;
              private ServerSocket server;
              private volatile boolean stopped = false;
              private final ExecutorService pool = Executors.newCachedThreadPool();
              private final ScheduledExecutorService timer = Executors.newSingleThreadScheduledExecutor();
              private final Set<Socket> open = ConcurrentHashMap.newKeySet();

              public SshSocks(String host, int port, String user, String pass) {
                  this.host = host;
                  this.port = port;
                  this.user = user;
                  this.pass = pass;
              }

              public void start() throws Exception {
                  JSch jsch = new JSch();
                  ssh = jsch.getSession(user, host, port);
                  ssh.setPassword(pass);
                  ssh.setConfig("StrictHostKeyChecking", "no");
                  ssh.setConfig("PreferredAuthentications", "password,keyboard-interactive");
                  ssh.setServerAliveInterval(15000);
                  ssh.setServerAliveCountMax(3);
                  ssh.connect(15000);

                  server = new ServerSocket();
                  server.setReuseAddress(true);
                  server.bind(new java.net.InetSocketAddress(InetAddress.getByName("127.0.0.1"), PORT), 256);
                  pool.execute(this::acceptLoop);
              }

              public boolean isAlive() {
                  return !stopped && ssh != null && ssh.isConnected();
              }

              public void stop() {
                  stopped = true;
                  try { if (server != null) server.close(); } catch (Exception ignored) { }
                  for (Socket s : open) {
                      try { s.close(); } catch (Exception ignored) { }
                  }
                  try { if (ssh != null) ssh.disconnect(); } catch (Exception ignored) { }
                  pool.shutdownNow();
                  timer.shutdownNow();
              }

              private void acceptLoop() {
                  while (!stopped) {
                      try {
                          final Socket c = server.accept();
                          open.add(c);
                          pool.execute(() -> handle(c));
                      } catch (IOException e) {
                          if (stopped) return;
                      }
                  }
              }

              private void handle(Socket c) {
                  try {
                      c.setTcpNoDelay(true);
                      DataInputStream in = new DataInputStream(c.getInputStream());
                      OutputStream out = c.getOutputStream();

                      if (in.readUnsignedByte() != 5) return;
                      int n = in.readUnsignedByte();
                      in.readFully(new byte[n]);
                      out.write(new byte[]{5, 0});
                      out.flush();

                      if (in.readUnsignedByte() != 5) return;
                      int cmd = in.readUnsignedByte();
                      in.readUnsignedByte();
                      int atyp = in.readUnsignedByte();
                      String dst;
                      if (atyp == 1) {
                          byte[] a = new byte[4];
                          in.readFully(a);
                          dst = InetAddress.getByAddress(a).getHostAddress();
                      } else if (atyp == 3) {
                          int l = in.readUnsignedByte();
                          byte[] a = new byte[l];
                          in.readFully(a);
                          dst = new String(a);
                      } else if (atyp == 4) {
                          byte[] a = new byte[16];
                          in.readFully(a);
                          dst = InetAddress.getByAddress(a).getHostAddress();
                      } else {
                          return;
                      }
                      int dport = in.readUnsignedShort();

                      if (cmd == 1) {
                          connectTcp(in, out, dst, dport);
                      } else if (cmd == 3) {
                          udpAssociate(in, out);
                      } else {
                          out.write(new byte[]{5, 7, 0, 1, 0, 0, 0, 0, 0, 0});
                          out.flush();
                      }
                  } catch (Exception ignored) {
                  } finally {
                      try { c.close(); } catch (Exception ignored) { }
                      open.remove(c);
                  }
              }

              private void connectTcp(final InputStream in, OutputStream out, String dst, int dport) throws Exception {
                  Channel ch = ssh.getStreamForwarder(dst, dport);
                  InputStream ri = ch.getInputStream();
                  final OutputStream ro = ch.getOutputStream();
                  try {
                      ch.connect(10000);
                  } catch (JSchException e) {
                      out.write(new byte[]{5, 5, 0, 1, 0, 0, 0, 0, 0, 0});
                      out.flush();
                      return;
                  }
                  out.write(new byte[]{5, 0, 0, 1, 0, 0, 0, 0, 0, 0});
                  out.flush();
                  pool.execute(() -> {
                      pipe(in, ro);
                      try { ro.close(); } catch (Exception ignored) { }
                  });
                  pipe(ri, out);
                  ch.disconnect();
              }

              private void pipe(InputStream i, OutputStream o) {
                  byte[] b = new byte[16384];
                  try {
                      int n;
                      while ((n = i.read(b)) >= 0) {
                          if (n > 0) {
                              o.write(b, 0, n);
                              o.flush();
                          }
                      }
                  } catch (IOException ignored) {
                  }
              }

              // ---- UDP (faqat DNS, port 53) ----

              private void udpAssociate(InputStream in, OutputStream out) throws Exception {
                  final DatagramSocket ds = new DatagramSocket(0, InetAddress.getByName("127.0.0.1"));
                  int p = ds.getLocalPort();
                  out.write(new byte[]{5, 0, 0, 1, 127, 0, 0, 1, (byte) (p >> 8), (byte) p});
                  out.flush();
                  pool.execute(() -> udpLoop(ds));
                  try {
                      while (in.read() != -1) { }
                  } catch (IOException ignored) {
                  }
                  ds.close();
              }

              private void udpLoop(final DatagramSocket ds) {
                  byte[] buf = new byte[65535];
                  try {
                      while (!stopped) {
                          DatagramPacket pk = new DatagramPacket(buf, buf.length);
                          ds.receive(pk);
                          final byte[] d = Arrays.copyOf(pk.getData(), pk.getLength());
                          final InetAddress ca = pk.getAddress();
                          final int cp = pk.getPort();
                          pool.execute(() -> handleUdp(ds, d, ca, cp));
                      }
                  } catch (IOException ignored) {
                  }
              }

              private void handleUdp(DatagramSocket ds, byte[] d, InetAddress ca, int cp) {
                  try {
                      if (d.length < 10 || d[2] != 0) return;
                      int atyp = d[3];
                      int hl;
                      String dst;
                      if (atyp == 1) {
                          hl = 10;
                          dst = (d[4] & 255) + "." + (d[5] & 255) + "." + (d[6] & 255) + "." + (d[7] & 255);
                      } else if (atyp == 4) {
                          hl = 22;
                          dst = InetAddress.getByAddress(Arrays.copyOfRange(d, 4, 20)).getHostAddress();
                      } else if (atyp == 3) {
                          int l = d[4] & 255;
                          hl = 7 + l;
                          dst = new String(d, 5, l);
                      } else {
                          return;
                      }
                      int dport = ((d[hl - 2] & 255) << 8) | (d[hl - 1] & 255);
                      if (dport != 53) return;
                      byte[] q = Arrays.copyOfRange(d, hl, d.length);
                      byte[] r = dnsOverTcp(dst, q);
                      byte[] resp = new byte[hl + r.length];
                      System.arraycopy(d, 0, resp, 0, hl);
                      System.arraycopy(r, 0, resp, hl, r.length);
                      ds.send(new DatagramPacket(resp, resp.length, ca, cp));
                  } catch (Exception ignored) {
                  }
              }

              private byte[] dnsOverTcp(String ip, byte[] q) throws Exception {
                  final Channel ch = ssh.getStreamForwarder(ip, 53);
                  InputStream i = ch.getInputStream();
                  OutputStream o = ch.getOutputStream();
                  ScheduledFuture<?> wd = timer.schedule(() -> ch.disconnect(), 8, TimeUnit.SECONDS);
                  try {
                      ch.connect(8000);
                      byte[] m = new byte[q.length + 2];
                      m[0] = (byte) (q.length >> 8);
                      m[1] = (byte) q.length;
                      System.arraycopy(q, 0, m, 2, q.length);
                      o.write(m);
                      o.flush();
                      DataInputStream di = new DataInputStream(i);
                      int n = di.readUnsignedShort();
                      byte[] r = new byte[n];
                      di.readFully(r);
                      return r;
                  } finally {
                      wd.cancel(false);
                      ch.disconnect();
                  }
              }
          }

          EOF
          mkdir -p "$(dirname 'app/src/main/java/uz/vpn/ssh/State.java')"
          cat > 'app/src/main/java/uz/vpn/ssh/State.java' <<'EOF'
          package uz.vpn.ssh;

          public class State {
              public static volatile boolean active = false;
              public static volatile boolean connected = false;
              public static volatile boolean paused = false;
              public static volatile String status = "Ulanmagan";
              public static volatile String error = "";
              public static volatile long upSpeed = 0, downSpeed = 0;
              public static volatile long upTotal = 0, downTotal = 0;

              public static String fmtSpeed(long bytesPerSec) {
                  double kb = bytesPerSec / 1024.0;
                  if (kb < 1024) return String.format("%.1f KB/s", kb);
                  return String.format("%.2f MB/s", kb / 1024.0);
              }

              public static String fmtSize(long bytes) {
                  double kb = bytes / 1024.0;
                  if (kb < 1024) return String.format("%.1f KB", kb);
                  double mb = kb / 1024.0;
                  if (mb < 1024) return String.format("%.2f MB", mb);
                  return String.format("%.2f GB", mb / 1024.0);
              }
          }

          EOF
          mkdir -p "$(dirname 'app/src/main/java/uz/vpn/ssh/TunnelService.java')"
          cat > 'app/src/main/java/uz/vpn/ssh/TunnelService.java' <<'EOF'
          package uz.vpn.ssh;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.drawable.Icon;
          import android.net.VpnService;
          import android.os.ParcelFileDescriptor;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.util.concurrent.Executors;
          import java.util.concurrent.ScheduledExecutorService;
          import java.util.concurrent.TimeUnit;

          import hev.htproxy.TProxyService;

          public class TunnelService extends VpnService {
              public static final String A_START = "uz.vpn.ssh.START";
              public static final String A_PAUSE = "uz.vpn.ssh.PAUSE";
              public static final String A_RESUME = "uz.vpn.ssh.RESUME";
              public static final String A_RECONNECT = "uz.vpn.ssh.RECONNECT";
              public static final String A_STOP = "uz.vpn.ssh.STOP";
              private static final String CH = "vpn";

              private final Object lock = new Object();
              private ParcelFileDescriptor tun;
              private SshSocks socks;
              private boolean tproxyOn = false;
              private long gen = 0;
              private long lastTx = 0, lastRx = 0;
              private volatile boolean stopping = false;
              private ScheduledExecutorService ticker;
              private NotificationManager nm;

              @Override
              public void onCreate() {
                  super.onCreate();
                  nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel(CH, "VPN", NotificationManager.IMPORTANCE_LOW));
                  State.active = true;
                  ticker = Executors.newSingleThreadScheduledExecutor();
                  ticker.scheduleAtFixedRate(this::tick, 1, 1, TimeUnit.SECONDS);
              }

              @Override
              public int onStartCommand(Intent in, int flags, int startId) {
                  startForeground(1, buildNotif());
                  String a = in == null ? null : in.getAction();
                  if (A_PAUSE.equals(a)) {
                      pause();
                  } else if (A_START.equals(a) || A_RESUME.equals(a) || A_RECONNECT.equals(a)) {
                      connect();
                  } else {
                      stopAll();
                  }
                  return START_NOT_STICKY;
              }

              private void connect() {
                  final long my;
                  synchronized (lock) {
                      stopping = false;
                      teardown();
                      my = ++gen;
                      State.paused = false;
                      State.connected = false;
                      State.status = "Ulanmoqda...";
                      State.error = "";
                      State.upTotal = 0;
                      State.downTotal = 0;
                  }
                  update();
                  final SharedPreferences p = getSharedPreferences("cfg", 0);
                  new Thread(() -> {
                      SshSocks s = null;
                      try {
                          s = new SshSocks(
                                  p.getString("ip", ""),
                                  Integer.parseInt(p.getString("port", "22")),
                                  p.getString("user", "root"),
                                  p.getString("pass", ""));
                          s.start();
                          synchronized (lock) {
                              if (my != gen) {
                                  s.stop();
                                  return;
                              }
                              Builder b = new Builder()
                                      .setSession("Otabek VPN")
                                      .setMtu(1500)
                                      .addAddress("10.8.0.2", 32)
                                      .addRoute("0.0.0.0", 0)
                                      .addDnsServer("8.8.8.8")
                                      .addDnsServer("1.1.1.1");
                              b.addDisallowedApplication(getPackageName());
                              ParcelFileDescriptor t = b.establish();
                              if (t == null) throw new IOException("VPN ruxsati berilmagan");

                              File cfg = new File(getFilesDir(), "tproxy.yml");
                              String yml = "tunnel:\n  mtu: 1500\n"
                                      + "socks5:\n  port: " + SshSocks.PORT + "\n  address: 127.0.0.1\n  udp: 'udp'\n"
                                      + "misc:\n  task-stack-size: 81920\n";
                              try (FileOutputStream fo = new FileOutputStream(cfg)) {
                                  fo.write(yml.getBytes("UTF-8"));
                              }
                              tun = t;
                              socks = s;
                              lastTx = 0;
                              lastRx = 0;
                              TProxyService.TProxyStartService(cfg.getAbsolutePath(), t.getFd());
                              tproxyOn = true;
                              State.connected = true;
                              State.status = "Ulangan";
                          }
                      } catch (Throwable e) {
                          if (s != null) s.stop();
                          synchronized (lock) {
                              if (my == gen) {
                                  teardown();
                                  State.status = "Ulanmadi";
                                  State.error = e.getClass().getSimpleName() + ": " + e.getMessage();
                              }
                          }
                      }
                      update();
                  }).start();
              }

              private void pause() {
                  synchronized (lock) {
                      teardown();
                      State.paused = true;
                      State.status = "Pauza";
                  }
                  update();
              }

              private void stopAll() {
                  synchronized (lock) {
                      stopping = true;
                      teardown();
                      State.paused = false;
                      State.status = "Ulanmagan";
                  }
                  stopForeground(true);
                  stopSelf();
              }

              /** lock ichida chaqiriladi */
              private void teardown() {
                  gen++;
                  if (tproxyOn) {
                      try { TProxyService.TProxyStopService(); } catch (Throwable ignored) { }
                      tproxyOn = false;
                  }
                  if (tun != null) {
                      try { tun.close(); } catch (Exception ignored) { }
                      tun = null;
                  }
                  if (socks != null) {
                      socks.stop();
                      socks = null;
                  }
                  State.connected = false;
                  State.upSpeed = 0;
                  State.downSpeed = 0;
              }

              private void tick() {
                  try {
                      synchronized (lock) {
                          if (tproxyOn) {
                              long[] st = TProxyService.TProxyGetStats();
                              if (st != null && st.length >= 4) {
                                  State.upSpeed = Math.max(0, st[1] - lastTx);
                                  State.downSpeed = Math.max(0, st[3] - lastRx);
                                  lastTx = st[1];
                                  lastRx = st[3];
                                  State.upTotal = st[1];
                                  State.downTotal = st[3];
                              }
                              if (socks != null && !socks.isAlive()) {
                                  teardown();
                                  State.status = "Aloqa uzildi";
                                  State.error = "Server bilan SSH aloqa uzildi";
                              }
                          }
                      }
                      update();
                  } catch (Throwable ignored) {
                  }
              }

              private void update() {
                  if (stopping) return;
                  nm.notify(1, buildNotif());
              }

              private Notification.Action act(String title, String action, int code) {
                  PendingIntent pi = PendingIntent.getService(this, code,
                          new Intent(this, TunnelService.class).setAction(action),
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  return new Notification.Action.Builder(
                          Icon.createWithResource(this, android.R.drawable.ic_menu_manage), title, pi).build();
              }

              private Notification buildNotif() {
                  String speed = "↑ " + State.fmtSpeed(State.upSpeed) + "   ↓ " + State.fmtSpeed(State.downSpeed);
                  String total = "Jami: ↑ " + State.fmtSize(State.upTotal) + "   ↓ " + State.fmtSize(State.downTotal);
                  PendingIntent open = PendingIntent.getActivity(this, 0,
                          new Intent(this, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                  Notification.Builder nb = new Notification.Builder(this, CH)
                          .setSmallIcon(android.R.drawable.ic_lock_lock)
                          .setContentTitle("Otabek VPN: " + State.status)
                          .setContentText(speed)
                          .setStyle(new Notification.BigTextStyle().bigText(speed + "\n" + total))
                          .setOngoing(true)
                          .setOnlyAlertOnce(true)
                          .setContentIntent(open);
                  if (State.connected) nb.addAction(act("Pauza", A_PAUSE, 1));
                  else if (State.paused) nb.addAction(act("Davom", A_RESUME, 2));
                  else nb.addAction(act("Qayta ulash", A_RECONNECT, 3));
                  nb.addAction(act("O'chirish", A_STOP, 4));
                  return nb.build();
              }

              @Override
              public void onRevoke() {
                  stopAll();
              }

              @Override
              public void onDestroy() {
                  stopping = true;
                  if (ticker != null) ticker.shutdownNow();
                  synchronized (lock) {
                      teardown();
                  }
                  State.active = false;
                  State.status = "Ulanmagan";
                  nm.cancel(1);
                  super.onDestroy();
              }
          }

